<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1829">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Bibiani Walk">
<title>Bibiani Field Walk</title>
<style>
/* Layout: one-screen field tool; sticky header + tab bar, scrolling card list; large touch targets for sunlight/gloves */
:root{
  --navy:#0B1829; --gold:#C8A84B; --gold-ink:#7A5E14;
  --bg:#F3F1EC; --card:#FFFFFF; --fg:#17202B; --muted:#5C6672; --line:#D8D4CB;
  --amber-bg:#FFF4D6; --amber-line:#E2B94A;
  --A:#1F7A3A; --P:#C77D00; --I:#C8381D; --X:#6B1E12; --N:#5C6672;
  --focus:#C8A84B;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1620; --card:#18212D; --fg:#E8E6E0; --muted:#A3ABB5; --line:#2C3744;
  --amber-bg:#2B2411; --amber-line:#A5852E; --N:#A3ABB5; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0F1620; --card:#18212D; --fg:#E8E6E0; --muted:#A3ABB5; --line:#2C3744;
  --amber-bg:#2B2411; --amber-line:#A5852E; --N:#A3ABB5; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 Arial,Helvetica,system-ui,sans-serif;display:flex;flex-direction:column;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{background:var(--navy);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;flex:none}
header .brand{font-weight:700;letter-spacing:.04em;font-size:15px}
header .brand small{display:block;font-weight:400;color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
header .status{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:11px;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;background:#7a8591;display:inline-block}
.dot.on{background:#3DD17A}.dot.warn{background:#F0B429}.dot.off{background:#E04B35}
nav.tabs{display:flex;overflow-x:auto;background:var(--navy);border-top:1px solid rgba(255,255,255,.12);flex:none;scrollbar-width:none;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;color:#C9CFD6;padding:12px 12px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.active{color:#fff;border-bottom-color:var(--gold)}
nav.tabs button .n{font-size:11px;color:var(--gold);margin-left:4px;font-weight:400;font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;padding-block:12px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.hdr{margin:4px 0 12px}
.hdr h2{margin:0 0 4px;font-size:20px;text-wrap:balance}
.hdr p{margin:0;color:var(--muted);font-size:13px}
.progress{display:flex;gap:4px;height:8px;margin:10px 0 0;border-radius:4px;overflow:hidden;background:var(--line)}
.progress span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px}
.filters button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card.msc{background:var(--amber-bg);border-color:var(--amber-line)}
.card.done{border-left:5px solid var(--rc,var(--line))}
.idrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.id{font-weight:700;font-size:13px;letter-spacing:.03em;background:var(--navy);color:#fff;padding:2px 8px;border-radius:4px;font-variant-numeric:tabular-nums}
.card.msc .id{background:var(--gold-ink)}
.mw{font-size:12px;color:var(--muted)}
.mw b{color:var(--fg)}
.std{font-weight:700;margin:0 0 4px;font-size:15px;line-height:1.35}
.ref{font-size:12px;color:var(--muted);margin:0 0 6px}
details.look summary{font-size:13px;color:var(--gold-ink);cursor:pointer;list-style:none;margin-bottom:4px}
details.look summary::before{content:"▸ "}details.look[open] summary::before{content:"▾ "}
details.look p{margin:0 0 8px;font-size:14px;font-style:italic;color:var(--fg)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.rate button{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:10px 0;font-weight:700;font-size:16px;min-height:46px}
.rate button[data-v="A"].sel{background:var(--A);border-color:var(--A);color:#fff}
.rate button[data-v="P"].sel{background:var(--P);border-color:var(--P);color:#fff}
.rate button[data-v="I"].sel{background:var(--I);border-color:var(--I);color:#fff}
.rate button[data-v="X"].sel{background:var(--X);border-color:var(--X);color:#fff}
.rate button[data-v="N"].sel{background:var(--N);border-color:var(--N);color:#fff}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);min-height:44px}
textarea{min-height:72px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.row>*{min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn.danger{color:var(--I);border-color:var(--I)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:13px}
.btn input[type=file]{position:absolute;opacity:0;width:0;height:0}
.geo{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1}
.geo.has{color:var(--A)}
.photos{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:thin}
.ph{flex:none;width:96px;position:relative}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--line)}
.ph .del{position:absolute;top:-6px;right:-6px;background:var(--I);color:#fff;border:0;border-radius:50%;width:26px;height:26px;font-size:14px;line-height:26px;padding:0}
.ph small{display:block;font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.wrap{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.kv b{color:var(--muted);font-weight:600}
.tile{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.tile div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.tile div b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tile div span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px}
.fab .btn{box-shadow:0 4px 12px rgba(0,0,0,.25);border-radius:30px;padding:12px 16px}
.seg{display:flex;gap:4px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 0;font-weight:700;min-height:40px;font-size:14px}
.seg button.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg button[data-v=Y].sel{background:var(--A);border-color:var(--A)}
.seg button[data-v=Pt].sel{background:var(--P);border-color:var(--P)}
.seg button[data-v=N].sel{background:var(--I);border-color:var(--I)}
.gpslist{max-height:40vh;overflow:auto;font-size:12px;font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}
.confirm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;align-items:center;justify-content:center;padding:20px}
.confirm.show{display:flex}
.confirm .box{background:var(--card);border-radius:12px;padding:16px;max-width:400px;width:100%}
.confirm .box .row{justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
h3{font-size:16px;margin:16px 0 8px}
.ex{border-left:4px solid var(--gold)}
.install{background:var(--gold);color:var(--navy);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-size:14px;display:none;align-items:center;gap:10px;flex:none}.install.show{display:flex}.install button{margin-left:auto;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:6px 10px}
</style>
</head>
<body>
<header>
  <div class="brand">IMSS · Bibiani Field Walk<small>Rev C · MSC Gold Code · Offline capture</small></div>
  <div class="status" title="GPS / storage">
    <span class="dot" id="gpsDot"></span><span id="gpsTxt">GPS</span>
    <span class="dot" id="dbDot"></span><span id="dbTxt">DB</span>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="install" id="install"><span><b>Install for offline use:</b> tap Share <span style="font-size:18px">&#x2191;</span> then <b>Add to Home Screen</b>, and open it from there.</span><button onclick="document.getElementById('install').classList.remove('show');try{localStorage.setItem('inst_hide','1')}catch(e){}">OK</button></div>
<main id="main"></main>
<div class="fab" id="fab"></div>
<div class="toast" id="toast"></div>
<div class="confirm" id="confirm"><div class="box"><p id="confirmMsg"></p><div class="row"><button class="btn" id="confirmNo">Cancel</button><button class="btn danger" id="confirmYes">Confirm</button></div></div></div>

<script>
const DATA = {"zones": [{"id": "Z0", "title": "Induction, kick-off and interviews", "note": "Day 1, 15 October. Site induction; GM, security, metallurgy, mining, HR; access list and interview schedule. 11 standards (10 Rev B + 1 Code line).", "stds": [{"id": "MG-PRO-01", "std": "Current, approved security SOPs and post orders exist for every post and every custody transfer, version-controlled and signed off.", "look": "Ask for the SOP set. Check dates and signatures. Can a guard produce the post order for the post he is on? Code Table 1 procedures (access, airlock, mill relining, redress, key control, scrap, searches, bullion dispatch) must exist, not only a manual.", "ref": "s12 and Table 1. Procedures executed under the flask concept: sealed containment, dual control, logged custody.", "mw": "—", "msc": false}, {"id": "MG-PRO-02", "std": "Incident register maintained with classification, investigation outcome and loss value, last 24 months available.", "look": "Sample five incidents end to end, including any parcel, high-grade spillage or gold-room anomaly. Code s11.2: a found parcel is handled only by security in the presence of a senior metallurgist, secured, assayed, and retained if CCTV identifies a suspect.", "ref": "s11.1 anonymous hotline; s11.2 parcels found. s2.6 staff duty to report.", "mw": "01", "msc": false}, {"id": "MG-PRO-03", "std": "Security governance: named accountable manager, security committee, KPIs reported to site management.", "look": "Minutes of the last three security meetings. Code s2.1: Manager Metallurgy chairs, minutes kept, Key Control Officer appointed in writing. Plant Manager reports anomalies to both metallurgy and security.", "ref": "ss2.1–2.5 roles. Collaboration between metallurgy and security is an objective, not a courtesy.", "mw": "—", "msc": false}, {"id": "MG-PER-01", "std": "Pre-employment vetting for all staff and contractors in gold-room, plant, security and IT roles.", "look": "Vetting policy; sample ten files across grades. Code s2.3 requires criminal screening before plant work. Polygraph (pre-employment and random/annual on smelt-house and plant staff) is a Code line; in Ghana rate the integrity-testing equivalent, and record if polygraph is not lawful or not used.", "ref": "s2.3 criminal screening; polygraph is SA Code practice — rate the control intent.", "mw": "01", "msc": false}, {"id": "MG-PER-02", "std": "Insider-risk programme: high-risk register, re-vetting, anomaly channel, same-day access revocation on exit.", "look": "High-risk role list. Last termination: was gold-room, vault and gate access revoked the same day? Code s2.6 anonymous hotline must actually be known on site.", "ref": "s2.6 hotline and awareness programme.", "mw": "01", "msc": false}, {"id": "MG-PER-03", "std": "Contractor and carrier management: security clauses, same vetting standard, time-bound access.", "look": "Contractor registers against the access-system list. Code s2.7: breaches may end the contract; cards returned on completion; requirements in the induction manual.", "ref": "s2.7. s4.2 no standing vehicle access lists for contractors.", "mw": "01 / 06", "msc": false}, {"id": "MG-PER-04", "std": "Security personnel licensed; supervision ratio; rotation off gold room and dispatch; no permanent posting.", "look": "Licence copies; last month’s roster. Code s2.4 Security Officer in Charge owns deployment. Permanent posting at the smelt house or dispatch is a Code fail.", "ref": "s2.4. s9.6 reserve right to deploy non-mine staff into the smelt house.", "mw": "01", "msc": false}, {"id": "MG-EMR-01", "std": "Emergency and crisis plans cover armed attack, mass incursion, blockade, abduction, TSF and cyber; exercised in 12 months.", "look": "Plan, exercise record, named crisis lead on and off site. Code also requires a written response for a stationary mill and for smelt-house abnormal work notified to security in advance.", "ref": "s6.5 mill treated as high security when stopped. s9.1 abnormal smelt-house work notified in writing.", "mw": "06 / 09 / 08", "msc": false}, {"id": "MG-EMR-02", "std": "Armed response (police/GAF/private) with agreed time, call-out and use-of-force consistent with the Voluntary Principles.", "look": "MoU or agreement; last call-out and actual time. Code s2.3 liaison with police on crime trends — rate the Ghana equivalent (GPS / GAF).", "ref": "s2.3 liaison. Use of force is an IMSS line; the Code does not set VPSHR.", "mw": "05", "msc": false}, {"id": "MG-EMR-03", "std": "Medical evacuation and casualty plan for security incidents; nearest facility and route confirmed.", "look": "Medevac provider; last drill. Code s4.1: a stretcher case leaving the plant is accompanied by security and searched at the destination.", "ref": "s4.1 stretcher escort and search.", "mw": "—", "msc": false}, {"id": "MG-MSC-19", "std": "Anonymous reporting channel is live, known, and followed up without exposing the reporter.", "look": "Ask three plant employees, not managers, how they would report a gold theft. Code requires an answering service and a confidential investigation.", "ref": "s2.6 and s11.1. New line — Rev B only implied this under MG-PER-02.", "mw": "01", "msc": true}]}, {"id": "Z1", "title": "Plant, ROM pad to gold room (follow the metal)", "note": "Day 2, 16 October. ROM → crushing and milling → sampling → weighing → gravity → CIL → elution and EW → smelt house → strong room. 18 Rev B standards, look-fors completed, plus 12 Code lines.", "stds": [{"id": "MG-ROM-01", "std": "ROM pad and stockpiles under CCTV with controlled access; high-grade stockpiles segregated and monitored.", "look": "Are high-grade fingers identifiable, fenced where possible, and who has access at night? Code s6.4: Manager Metallurgy is told by geology/mining before a high-grade campaign.", "ref": "s6.4 shaft / campaign high-grade under CCTV and, where possible, fenced.", "mw": "01 / 02", "msc": false}, {"id": "MG-ROM-02", "std": "Sampling, sample preparation and assay-lab access restricted; custody logged; duplicate or umpire practice in place.", "look": "Who enters the lab and sample prep? Is the chain logged? Duplicates run? Code s7.11 bullion samples move the same day in a double-locked box, escorted by plant and security, receipted.", "ref": "s7.11 bullion sample boxes (“Plant 1 and 2” / “Laboratory 1 and 2”), reverse procedure for returns.", "mw": "01 / 08", "msc": false}, {"id": "MG-ROM-03", "std": "Weightometers and belt scales calibrated on schedule; adjustments logged and auditable.", "look": "Certificates; who can change scale settings. Code s7.5: record actual weights, no moisture allowance written into the book.", "ref": "s7.5 actual weights. s7.8 gold register includes assay and fine-gold content.", "mw": "08", "msc": false}, {"id": "MG-ROM-04", "std": "Grade-control data reconciled to mill feed; unexplained variance investigated.", "look": "Last three months’ mine-to-mill reconciliation. A variance with no investigation is not Partial — it is Inadequate against the Code objective of an auditable prime product.", "ref": "s1.3 protect the prime product by auditable measures. Links to s7 registers.", "mw": "08", "msc": false}, {"id": "MG-PLT-01", "std": "Gravity circuit is locked, dual-custody and CCTV-covered; concentrate movements weighed and logged.", "look": "Prime insider target. Who opens the room? Is the camera view clear of the discharge pipe? Flanges fully bolted and tag-welded. Feed drained and stopped before a pipe is removed. No vigorous bowl wash that throws concentrate across the floor. Cage if not otherwise enclosed.", "ref": "s6.7 gravity concentrators. s6.2 gravity, Gemini and clean-up are named high-risk activities.", "mw": "01", "msc": false}, {"id": "MG-PLT-02", "std": "Carbon movements controlled and reconciled; fines and screens secured.", "look": "Where does loaded carbon sit between stages, and who moves it? Daily inventory of fresh, loaded, stripped, regenerated and fine carbon. Fines dried and loaded under a plant official and CCTV, seal numbers in a carbon register. Loaded-carbon screens and measurement tanks on CCTV.", "ref": "s6.9 CIP/CIL. Eluate lines marked, lit, CCTV; flangeless or tack-welded flanges.", "mw": "01", "msc": false}, {"id": "MG-PLT-03", "std": "Elution and electrowinning: cathode sludge and cell cleaning under dual custody, weighed, on CCTV; cells lockable.", "look": "Watch the cell-clean procedure and who witnesses it. Cells double-locked with lock protectors; drain valves locked; rectifiers locked (an open rectifier stop sends cathode sludge to the eluant tank). Sludge catchment drained and recovered immediately after strip, not left overnight. Repair leaking cells the same shift.", "ref": "s6.10 electrowinning, sludge catchment, eluant tanks. s6.9 stripping only with Plant Manager authority and security notified.", "mw": "01", "msc": false}, {"id": "MG-PLT-04", "std": "Plant access zoned: no unescorted access to gravity, EW or smelt by general staff, contractors or cleaners.", "look": "Walk the route a cleaner would take at 02:00. Code s6.1 work only by persons selected by the plant official responsible for the metal, under CCTV.", "ref": "s6.1 high-risk areas. s4.1 visitors restricted to predefined roles.", "mw": "01", "msc": false}, {"id": "MG-PLT-05", "std": "Spillage, sumps, drains and scats managed as custody points.", "look": "Floors, sumps, drain covers, scats bins. Non-CIL sumps cleaned and grated. French drains double-locked. Sump discharge back to leach or mill, and the discharge point not reachable. Conveyor scrapers in place; belt spillage cleaned the same shift. Nothing stacked within 1 m of smelt-house walls.", "ref": "ss6.3, 6.6, 3.5. Cyclone feed pumps are a centrifuge — leakage there is high-grade.", "mw": "01", "msc": false}, {"id": "MG-PLT-06", "std": "Search regime leaving high-value zones, with supervision and a refusal procedure.", "look": "Observe a shift change at the gravity or gold-room exit. Hands-free or hand-held metal detection on exit; physical search in a room with CCTV and audio. Female search procedure written and lawful. Refusal goes to a private cubicle at the gate, not a wave-through. Random searches inside the plant, not only at the gate.", "ref": "ss4.1 and 4.4. s9.5 smelt-house search on entry and exit.", "mw": "01", "msc": false}, {"id": "MG-SMT-01", "std": "Smelt house and gold room: hardened structure, single controlled entry with interlock, dual custody, anti-passback.", "look": "Doors, walls, ceiling, windows, ducts. Walls brick or concrete. Roof sheet secured with a steel screen. Penetrations sealed. Floors smooth concrete. Door bullet-resistant or heavy plate with a five-lever mortice, external cage interlocked with the door, fish-eye or camera before open, biometric or equivalent. UPS or generator for cameras and emergency light.", "ref": "s3.5 construction. s9.5 and s9.8 airlock doors interlocked; outside door preferably from the control room.", "mw": "01", "msc": false}, {"id": "MG-SMT-02", "std": "Full CCTV from sludge receipt to bar stamping; no blind spots; 90-day retention; recorder outside the room.", "look": "Camera positions against the process, including bar drilling, furnace mouth, calciner, dust bin and washing table. Who can delete footage? Code minimum retention is three months, off the smelt-house floor.", "ref": "s5.1 and s5.2. s7.2 direct view of bar drilling. s6.10 furnace on 24-hour CCTV.", "mw": "01 / 04", "msc": false}, {"id": "MG-SMT-03", "std": "Doré weighed, sampled, numbered and stamped in the presence of two authorised persons; bar register reconciled to sludge in and vault receipts each smelt.", "look": "Bar register; last five smelts, input against output. Stamped with 12 mm steel dies, mine identity and serial. Registers in ink, numbered pages, single-line corrections signed by both combination holders, no pencil, no loose sheets, no pages removed. Scribbling book numbered. Registers stored apart so one loss does not take both.", "ref": "ss7.1, 7.5–7.8. Dual signature of Chief Smelter and Plant Manager on the smelt-house register.", "mw": "01 / 08", "msc": false}, {"id": "MG-SMT-04", "std": "Slag, crucibles, furnace clean-outs and dust treated as gold-bearing and reconciled.", "look": "Where is slag kept, and who handles it? Crushed before it is bagged. Numbered seals, verified by the smelt-house supervisor and a security officer before dispatch. Dust bins screened, double-locked, recovered under security. Worn liners and trays cut up inside and milled or quarantined until certified clean.", "ref": "ss6.10, 7.4, 7.9, 9.3, 9.12. Do not pick prills up by hand.", "mw": "01", "msc": false}, {"id": "MG-SMT-05", "std": "Gold-room staff dedicated, vetted, rotated; no personal effects, phones or bags; change and search at entry and exit.", "look": "Observe the search. Phones prohibited unless written authority. Clean change house to the search, dirty change house to the smelt house. Pocketless work clothes, laundry on site, worn PPE calcined into a smelt. Shower on exit. Artisans use the visitor corridor, searched, and do not change.", "ref": "ss9.4–9.7, 9.9, 9.10. s4.1 phones, firearms, mercury and cameras prohibited without written authority.", "mw": "01", "msc": false}, {"id": "MG-SMT-06", "std": "Duress, intrusion and access events from the gold room alarm to the control room and off site in real time.", "look": "Test a duress button with the control room. Silent radio alarm, concealed button. Alarm stays on screen until acknowledged.", "ref": "ss3.4, 3.5, 5.2, 5.3.", "mw": "01", "msc": false}, {"id": "MG-KEY-01", "std": "Keys, codes and credentials for gravity, EW, gold room, vault and magazine under two-person issue; codes changed on staff change.", "look": "Key register; who holds the vault keys now. Combination known to one custodian. Single sealed copy, flaps initialled with the Manager Metallurgy, held by the Security Manager. New custodian changes the code. Metallurgical staff hold no keys to plant gates. Padlocks numbered, two active sets, one reserve; a lock stays locked unless the registered holder is present.", "ref": "s8 entire. s3.2 no metallurgical gate keys. s7.3 Grade 3 safe inside the strong room, double control.", "mw": "01", "msc": false}, {"id": "MG-MAT-01", "std": "Every custody handover of gold-bearing material is weighed or counted, signed by two people, and reconciled to the next node.", "look": "This is the spine. If it does not exist, draft it on the transfer-point register in this checklist before you leave the plant. Code s7.1: two reliable employees (Chief Smelter and Senior Metallurgist) present to open storage, containers or furnaces.", "ref": "s7.1 double-locking principle. s12 flask concept.", "mw": "01 / 08", "msc": false}, {"id": "MG-MSC-01", "std": "Mill stoppage and relining treated as a gold event, not a maintenance event.", "look": "Written notice to the Security Officer. Senior metallurgist present. Body cameras and CCTV. Hopper locked while stationary. Mill-stop alarm to security. Concentrates hosed back or, if moved to the smelt house, double-locked and weighed on arrival. Pocketless overalls, laundered in the mill building. Liners stored secured until scrubbed and certified, then double-locked before third-party treatment.", "ref": "s6.5. New line — Rev B had no mill-relining standard.", "mw": "01", "msc": true}, {"id": "MG-MSC-02", "std": "Cyclones, mill-discharge tanks and cyclone-feed pumps under CCTV, with leakage treated as high-grade.", "look": "Stand at the pumps. A leaking gland is a centrifuge of gold-bearing material. Spillage reported, not hosed to an open drain.", "ref": "s6.6. New line.", "mw": "01", "msc": true}, {"id": "MG-MSC-03", "std": "Redress / Gemini room: cage, locks, mag-lock, sump back to the mill, discharge unreachable, double-locked screen, CCTV.", "look": "Walk the redress door and the sump. A shaking table with an open sump is an unrecorded transfer point.", "ref": "s6.8. New line — Rev B mentioned Gemini only inside MG-PLT-01.", "mw": "01", "msc": true}, {"id": "MG-MSC-04", "std": "CIP/CIL tank tops covered and locked; drop and drain valves single-locked; keys with security. Heat-exchanger scale washed back under supervision, uncleaned exchangers double-locked.", "look": "Ask who holds the drain-valve keys. A valve key on a plant board is a Code fail.", "ref": "s6.9. New line.", "mw": "01", "msc": true}, {"id": "MG-MSC-05", "std": "Calciner doors and lifting gear double-locked. Furnace mouth covered and double-locked when idle, 24-hour CCTV. Moulds and trays under camera. Washing-table sump cleaned at least weekly, drain locked, screens up.", "look": "Look at the furnace lid and the washing table, not the procedure.", "ref": "s6.10. New line — Rev B covered sludge, not the furnace.", "mw": "01", "msc": true}, {"id": "MG-MSC-06", "std": "Furnace dust and eluant-tank sludge recovered only under security, then smelted or sealed in the smelt house. Acid-treatment equipment inside the smelt house, storage double-locked even when empty.", "look": "Who last opened the dust bin, and is it on camera?", "ref": "s6.10. New line.", "mw": "01", "msc": true}, {"id": "MG-MSC-07", "std": "Strong room: reinforced concrete, at least two combination locks, time lock, vibration and movement sensors, fog unit. Inner safe minimum equivalent of SABS Grade 3; bullion container minimum Grade 4 or insurer equivalent. No non-precious items. Content register. Not opened in front of contractors.", "look": "Read the door plate and the sensor list. Count against the register with the custodians if permitted.", "ref": "ss7.2 and 7.3. New line — Rev B vault tests sit in Z3; the smelt-house strong room is a separate node.", "mw": "01", "msc": true}, {"id": "MG-MSC-08", "std": "Flux, moulds, pots, liners, filter cloth and work clothes under double padlock or continuous CCTV. By-product bags sealed and the seal checked by supervisor and security before dispatch.", "look": "A flux store is a recovery workshop if it is open.", "ref": "ss7.9 and 7.10. New line.", "mw": "01", "msc": true}, {"id": "MG-MSC-09", "std": "Smelt-house sewer, shower and laundry effluent trapped. Traps solid or balloon, double-locked, keys with Plant Manager and Security Officer, opened only under security.", "look": "Find the trap. If it is a bolted flange anyone can open, mark Inadequate.", "ref": "s9.4. New line.", "mw": "01", "msc": true}, {"id": "MG-MSC-10", "std": "Forklift used inside the smelt house does not leave. Servicing inside the airlock under security. Welding sets and acetylene not stored inside; used under supervision and removed or piped in from outside.", "look": "Look in the airlock and the store.", "ref": "ss9.8 and 9.11. New line.", "mw": "01", "msc": true}, {"id": "MG-MSC-11", "std": "Order of the house: only current equipment inside; miscellaneous gold products (including overalls) processed immediately; floors vacuumed after the smelt and the dust added to the next smelt; prills, drillings and slag not picked up by hand.", "look": "Walk the floor after asking when the last smelt was.", "ref": "ss9.2 and 9.3. New line.", "mw": "01", "msc": true}, {"id": "MG-MSC-12", "std": "Locksmith and lock repair only through security, credentials checked, security officer present. Suspicion of a compromised code forces a reset the same day.", "look": "Ask when a lock was last changed and who was in the room.", "ref": "ss8.3 and 8.6. New line.", "mw": "01", "msc": true}]}, {"id": "Z2", "title": "Perimeter, access, magazine, TSF and concession edge", "note": "Day 3, 17 October. Fence, gates, vehicle search, magazine, TSF, haul roads, concession edge, control room; night observation from inside the fence. 25 Rev B standards + 3 Code lines.", "stds": [{"id": "MG-PRM-01", "std": "Plant and high-value areas enclosed by an inner security fence, separate from the concession boundary, clear both sides, no climbing aids.", "look": "Walk the inner fence. Code standard for a new or feasible plant: double fence, minimum 15 m no-man’s-land, 2.2–3 m, welded mesh and razor flat-wrap, alarm on at least one fence, vegetation controlled, buildings 10 m off the inner fence or covered by CCTV. If Bibiani cannot meet the geometry, mark Partial or Inadequate and raise an Exception Report — do not mark N because the plant is old.", "ref": "s3.1. Exception path ss1.4 and 15.", "mw": "02", "msc": false}, {"id": "MG-PRM-02", "std": "Perimeter intrusion detection on the inner fence, with control-room alarm and a patrol response.", "look": "Last month’s alarm log and response times. Code: alarm and detection in the no-man’s-land; K9 or video motion detection as enhancement, not as a substitute for a fence.", "ref": "s3.1.", "mw": "02", "msc": false}, {"id": "MG-PRM-03", "std": "Concession boundary demarcated, patrolled, encroachment monitored; artisanal workings mapped and dated.", "look": "Map of galamsey against the concession; last patrol. Not a Code line — Ghana typology. Keep it.", "ref": "No MSC equivalent. IMSS MW-02.", "mw": "02", "msc": false}, {"id": "MG-ACC-01", "std": "Electronic access control, zoned permissions, anti-passback, dual authorisation at high-value zones.", "look": "Permission matrix; test tailgating. Code s4.1 fingerprint or facial for employees and permanent contractors. One-directional flow at entry and exit.", "ref": "s4.1.", "mw": "01", "msc": false}, {"id": "MG-ACC-02", "std": "Visitor and contractor induction, escort, time-bound badges, badge return enforced.", "look": "Visitor log against badges outstanding. Visitors and temporary employees on permit and sign-in, card countersigned on exit. Off-duty staff are visitors after hours.", "ref": "s4.1. s2.7 card return.", "mw": "01", "msc": false}, {"id": "MG-VEH-01", "std": "Vehicle search at entry and exit, including light vehicles, buses, waste and scrap; pit or mirrors; random deep search; CCTV of the bay.", "look": "Observe an exit search. Concentrate and scrap loads sealed? Code: airlock, belly scope, radio, vehicle register, step ladder; interlocked gates; spike bars or high-quality barriers; ground gap ≤ 10 cm; down-pins concreted; after-hours vehicles only for emergencies, recorded in the occurrence book. Delivery vehicles escorted and removed immediately. Tool list on every vehicle in or out.", "ref": "ss3.2 and 4.2.", "mw": "01", "msc": false}, {"id": "MG-VEH-02", "std": "Weighbridge calibrated, on CCTV, ticketed, operator cannot edit weights; scrap and waste reconciled.", "look": "Software audit trail. Code s4.3: scrap de-scaled, site procedure, random search during loading; combustible waste burnt in an incinerator inside the fence; only smelt-house steel scrap fed to the mills.", "ref": "s4.3 scrap and waste.", "mw": "01 / 08", "msc": false}, {"id": "MG-SUR-01", "std": "CCTV covers perimeter, gates, search bays, custody points, gold room, vault, magazine and dispatch; live-monitored; 90-day retention; recorders secured.", "look": "Count cameras, note dead cameras, check retention on the NVR. Code s5.1: control room outside the plant, watching collusion between security and metallurgy as well as the metal.", "ref": "ss5.1 and 5.2. Three-month minimum retention.", "mw": "01 / 02", "msc": false}, {"id": "MG-SUR-02", "std": "Analytics and thermal on approaches and the concession edge where illegal mining is active.", "look": "Line-crossing, loitering, LPR. Code s5.2 allows AI tracking where possible; do not fail the site for lacking a named vendor.", "ref": "s5.2 AI where possible. Brand names in the Code (Hikvision) are not a Bibiani requirement.", "mw": "02", "msc": false}, {"id": "MG-LGT-01", "std": "Security lighting on perimeter, gates, search bays, custody areas and dispatch; on backup power; failure repaired inside a set time.", "look": "Night observation: which areas are dark? Code: paths to gates lit; smelt house lit inside and out in hours of darkness.", "ref": "ss3.2 and 3.5.", "mw": "02", "msc": false}, {"id": "MG-IDS-01", "std": "Intrusion alarms on gold room, vault, magazine, lab, server room and stores, annunciated, with a response SOP.", "look": "Alarm test; last log. Code: alarm display remains until acknowledged.", "ref": "s5.2.", "mw": "01", "msc": false}, {"id": "MG-GRD-01", "std": "Guard force sized to posts; supervision every shift; electronic tour verification; routes vary; night edge patrols with escort rules.", "look": "Post list against roster; last week’s tour data.", "ref": "s2.4 deployment. Not a detailed Code line.", "mw": "01 / 02", "msc": false}, {"id": "MG-GRD-02", "std": "Contractor performance against KPIs; contract allows removal; contractor staff vetted and rotated.", "look": "Contract and KPI report. Code s2.7 contract termination for a breach.", "ref": "s2.7.", "mw": "01", "msc": false}, {"id": "MG-COM-01", "std": "Radio covers the concession and the start of the dispatch route; backup channel; control room can reach every post.", "look": "Radio check from the concession edge and the TSF. Code s3.4: gate has a telephone with concealed wiring and a two-way radio.", "ref": "s3.4.", "mw": "—", "msc": false}, {"id": "MG-CTR-01", "std": "Control room secured, manned 24/7, sees CCTV, alarm, access and tracking; SOPs; escalation to site management and off-site.", "look": "Sit in for 30 minutes. Count screens against cameras. Ask what happens on a gold-room alarm. Code: brick building outside the plant, own ablutions, biometric access, operator training schedule, dedicated UPS or generator. Black-screen monitoring and a dash camera on the operators are Code lines — rate them, they are not optional flavour.", "ref": "s5.2.", "mw": "01", "msc": false}, {"id": "MG-CTR-02", "std": "Control room links out: police/GAF, medical, crisis lead, IMSS ROC; contact list current and tested.", "look": "Code s2.3 liaison. Test one external number.", "ref": "s2.3.", "mw": "—", "msc": false}, {"id": "MG-EXP-01", "std": "Magazines licensed, sited, constructed and secured; dual custody; CCTV and intrusion; keys controlled.", "look": "Licence, construction, locks, cameras, approach. Not a gold-room Code line. Rate it; do not drop it.", "ref": "No MSC equivalent. IMSS MW-10.", "mw": "10", "msc": false}, {"id": "MG-EXP-02", "std": "Explosives, detonators and AN reconciled per issue and return; unexplained variance investigated.", "look": "Last quarter. Returns from the face.", "ref": "No MSC equivalent.", "mw": "10", "msc": false}, {"id": "MG-EXP-03", "std": "Explosives transport magazine-to-face escorted and documented; supplier deliveries checked against orders.", "look": "One delivery docket against the magazine book.", "ref": "No MSC equivalent.", "mw": "10 / 06", "msc": false}, {"id": "MG-TSF-01", "std": "TSF and critical infrastructure access-controlled, patrolled, monitored; sabotage and theft in the TSF risk assessment.", "look": "Who can reach the wall and the decant? Cable and pipe theft history. Code s5.1 includes pipelines and outside assets.", "ref": "s5.1 pipelines.", "mw": "08", "msc": false}, {"id": "MG-TSF-02", "std": "Tailings re-mining by artisanal miners prevented; beach and return-water patrolled.", "look": "Ghana typology. Keep.", "ref": "No MSC equivalent.", "mw": "02 / 08", "msc": false}, {"id": "MG-ART-01", "std": "Artisanal presence on and next to the concession mapped, dated, trended; financiers and enablers recorded.", "look": "Ask community relations and security separately.", "ref": "No MSC equivalent. IMSS MW-02.", "mw": "02", "msc": false}, {"id": "MG-ART-02", "std": "Engagement and enforcement policy set by management, lawful, documented; no ad-hoc force; incidents recorded.", "look": "Last three incursions and how handled.", "ref": "No MSC equivalent.", "mw": "02 / 09", "msc": false}, {"id": "MG-CMP-01", "std": "Camp and expatriate accommodation secured; movement between camp and site managed.", "look": "Fence, access, guarding, lighting.", "ref": "No MSC equivalent.", "mw": "06 / 07", "msc": false}, {"id": "MG-SGN-01", "std": "Legal, warning and search-consent signage at entries, high-value zones and boundaries, in the relevant languages.", "look": "English and Twi at minimum on the search points. Code s4.1 prohibited-items board.", "ref": "s4.1 information board.", "mw": "—", "msc": false}, {"id": "MG-MSC-16", "std": "Vehicle gates other than the main airlock are double-locked (Grade 4 or equivalent); keys only in a security cabinet; not used for pedestrians. Hinges secured.", "look": "Walk every gate, not only the main entrance.", "ref": "s3.2. New line.", "mw": "02", "msc": true}, {"id": "MG-MSC-17", "std": "Pedestrian entrance in brick, with an interlocked steel cage, bullet-resistant door or heavy plate and five-lever mortice, metal detection, and UPS for cameras and emergency light. Silent duress button to the control room. Gate alterations approved by security and the Manager Metallurgy.", "look": "Stand in the cage. Can both doors be open at once?", "ref": "ss3.3 and 3.4. New line.", "mw": "01", "msc": true}, {"id": "MG-MSC-18", "std": "Goods out: waybill or works order, pre-numbered book, cleaning certificate, security inspection for a hidden parcel, authorised-signatory list at the gate. High-grade samples leave only in a locked container with a permit.", "look": "Pull three recent scrap or pump-repair waybills.", "ref": "s4.3. New line.", "mw": "01", "msc": true}]}, {"id": "Z3", "title": "Dispatch and transport (documents and route, not a live movement)", "note": "Day 4, 18 October. Code s10.1 is written for Rand Refinery. The control intent is applied to the Bibiani offtake.", "stds": [{"id": "MG-VLT-01", "std": "Vault: rated construction, time delay or dual key, anti-passback, CCTV inside and out, intrusion detection, no single-person access.", "look": "Door rating; who has keys or codes; last audit. Code minimum: reinforced concrete, two combination locks, time lock, vibration, movement, fog, Grade 4 (or insurer equivalent) bullion container, Grade 3 inner safe, double control.", "ref": "ss7.2 and 7.3. s8.2 two timing devices on the time lock.", "mw": "01", "msc": false}, {"id": "MG-VLT-02", "std": "Vault register reconciled to the gold-room bar register and to dispatch; independent monthly count.", "look": "Do the count if permitted. Code: check on every custodian change, both sign.", "ref": "ss7.2 and 7.6.", "mw": "01 / 08", "msc": false}, {"id": "MG-VLT-03", "std": "Dispatch: bars packed, sealed and weighed under dual custody and CCTV; seal numbers, weights and bar numbers on the note; signatories named and few.", "look": "Last three shipments. Code s10.1 loading under the Manager Metallurgy or delegate, security present, consignment checked at handover. Rand Refinery notification codes become the offtake refinery protocol — do not mark N because the bars do not go to Germiston.", "ref": "s10.1, adapted from Rand Refinery to the Bibiani offtake.", "mw": "01 / 06", "msc": false}, {"id": "MG-VLT-04", "std": "Dispatch timing, route and method not predictable; need-to-know; no advance notice on an open channel.", "look": "Who knows a dispatch is happening, and when? WhatsApp notice is Inadequate against Code intent and against MG-INF-01.", "ref": "s10.1 communication methods and codes. s5.1 need-to-know is IMSS; Code requires restricted procedure.", "mw": "06 / 01", "msc": false}, {"id": "MG-VLT-05", "std": "Refinery receipt reconciled to dispatch (weight, assay, bar numbers) inside an agreed time; discrepancies investigated.", "look": "Last six outturns against dispatch. Code s7.8 gold register holds refinery adjustments and fine-gold account.", "ref": "s7.8. s10.1.", "mw": "08 / 03", "msc": false}, {"id": "MG-HVT-01", "std": "Licensed, insured carrier or armed escort; vehicles tracked; route and time varied; convoy protocol; no stops.", "look": "Contract, tracking, route plan. Code leaves the vehicle-or-helicopter choice to the mine procedure — the procedure must exist.", "ref": "s10.1 and Table 1 bullion dispatch procedure.", "mw": "06", "msc": false}, {"id": "MG-HVT-02", "std": "Route risk assessment current for road and air; choke points, recent robberies, police points, alternates.", "look": "Drive or map the first 20 km.", "ref": "No MSC route chapter. Keep the IMSS line.", "mw": "06", "msc": false}, {"id": "MG-HVT-03", "std": "Handover at airport or refinery with identity check of the receiver; protocol for a claimed official stop or seizure.", "look": "Impersonation scenario S3 — what would the crew do?", "ref": "IMSS S3. Code s10.1 authentication of the receiving party.", "mw": "05 / 06", "msc": false}]}, {"id": "Z4", "title": "Systems and data", "note": "Day 5, 19 October. LIMS, historian, metal accounting, gold-room registers, refinery outturns; OT, security and corporate networks.", "stds": [{"id": "MG-OTN-01", "std": "OT, security and corporate networks segmented; remote access on MFA and logged; no vendor default credentials.", "look": "Network diagram; list of remote-access accounts.", "ref": "Code s5.2 does not specify MFA. Rate the IMSS line; do not invent a Code clause.", "mw": "04", "msc": false}, {"id": "MG-OTN-02", "std": "Privileged accounts on LIMS, historian, metal accounting, weighbridge, access control and CCTV limited, reviewed, revoked on exit; changes logged.", "look": "Who can edit a weight, an assay, or delete footage? Code s5.2 system secured; s7.5 register integrity is the paper equivalent.", "ref": "s5.2 and s7.5.", "mw": "04 / 01", "msc": false}, {"id": "MG-OTN-03", "std": "Backups of security and MC&A isolated and tested; cyber plan raises the physical posture when CCTV or access control is lost.", "look": "Ask what the gate does if the NVR is down. Code s5.3 maintain to minimise downtime; s3.3 UPS for cameras.", "ref": "ss5.3 and 3.3.", "mw": "04", "msc": false}, {"id": "MG-OTN-04", "std": "Payment and dispatch-approval workflows have dual authorisation and out-of-band verification.", "look": "BEC test. Not a Code line. Keep it — Bibiani threat F3.", "ref": "No MSC equivalent.", "mw": "04", "msc": false}, {"id": "MG-MAD-01", "std": "Metal accounting with a monthly balance per node and a documented reconciliation method, AMIRA P754-aligned.", "look": "Last 12 months’ balances and the method. The Code does not cite P754; its registers (strong room, smelt house, gold, carbon, by-product) are the custody layer under the balance. Both must exist.", "ref": "ss7.5–7.9 registers are the Code’s accounting evidence. P754 is the IMSS / MSC practice standard.", "mw": "08 / 01", "msc": false}, {"id": "MG-MAD-02", "std": "Assay and LIMS audit trail intact; results not alterable without a logged reason; sample IDs trace to physical samples.", "look": "Pull one month’s audit log. Code s7.11 sample escort and receipt are the physical half.", "ref": "s7.11.", "mw": "08 / 04", "msc": false}, {"id": "MG-MAD-03", "std": "Historian, weighing and flow data retained at shift resolution for at least 24 months, read-only for independent assurance.", "look": "Data-availability score. Code does not set 24 months; do not water the IMSS line down.", "ref": "IMSS line. Code is silent on historian retention.", "mw": "08", "msc": false}, {"id": "MG-MAD-04", "std": "Gold-room registers, vault register and refinery outturns are controlled records; master copy held by someone who does not work in the gold room.", "look": "Who holds the master? Code s7.6 strong-room register stays in the strong room; s7.8 gold register in the supervisor’s office; registers stored apart.", "ref": "ss7.5–7.8.", "mw": "01 / 08", "msc": false}, {"id": "MG-INF-01", "std": "Dispatch schedules, drawings, camera layouts, rosters and high-grade maps classified, access-limited, not on open channels.", "look": "How is dispatch communicated? Code s8.3 combination envelopes carry no description of purpose on the outside.", "ref": "s8.3 and s10.1.", "mw": "01 / 06", "msc": false}]}, {"id": "Z5", "title": "Community, stakeholders and public security", "note": "Day 6, 20 October. These seven standards are IMSS typology. The Code does not cover them. They are not diluted, and they are not dressed up as Code clauses.", "stds": [{"id": "MG-CMI-01", "std": "Stakeholder map maintained; grievance mechanism operating with recorded resolution times.", "look": "Grievance log; last three and outcome.", "ref": "No MSC equivalent. Keep.", "mw": "09", "msc": false}, {"id": "MG-CMI-02", "std": "Land, compensation and chieftaincy disputes identified, with status and security implication.", "look": "Ask community relations, then security. Do the answers match?", "ref": "No MSC equivalent.", "mw": "09", "msc": false}, {"id": "MG-CMI-03", "std": "Security under a human-rights policy (Voluntary Principles); use-of-force rules, training, allegation handling.", "look": "Training records; any allegation in 24 months.", "ref": "No MSC equivalent. Do not import it into the Code.", "mw": "09 / 05", "msc": false}, {"id": "MG-CMI-04", "std": "Community early warning that would surface a mobilisation, blockade or incursion before it happens.", "look": "Who would call security first, and have they?", "ref": "No MSC equivalent.", "mw": "09 / 02", "msc": false}, {"id": "MG-PSL-01", "std": "Public-security deployment governed by a written MoU: numbers, command, conduct, logistics, reporting; no cash outside the MoU.", "look": "MoU; how paid; who commands on site.", "ref": "Code s2.3 liaison only. MoU discipline is IMSS.", "mw": "05", "msc": false}, {"id": "MG-PSL-02", "std": "Verification protocol before any state agency searches, seizes or arrests: identity and authority checked with a named liaison.", "look": "Ask the gate supervisor. Scenario S3.", "ref": "IMSS S3. Code is silent.", "mw": "05", "msc": false}, {"id": "MG-PSL-03", "std": "Allegations of extortion, collusion or excessive force by deployed personnel recorded, escalated and acted on.", "look": "Register extract.", "ref": "No MSC equivalent.", "mw": "05", "msc": false}]}, {"id": "Z6", "title": "Underground: portals, declines, stopes and UG explosives", "note": "Day 3, 17 October. The Code has no underground chapter. These 11 standards are unchanged in intent. High-grade ore is rated against Code s6.4 once it reaches the ROM.", "stds": [{"id": "MG-UGA-01", "std": "Every portal and decline is a single controlled entry; personnel tracking reconciled to the roster at shift change.", "look": "Stand at shift change. Count the board against the roster. Ask when a count last failed.", "ref": "No MSC underground chapter. High-grade ore is still prime product — s6.4 applies when it reaches surface.", "mw": "01", "msc": false}, {"id": "MG-UGA-02", "std": "Exit search at the portal for everyone, including crib boxes, bags and vehicles; applied to supervisors and contractors.", "look": "Watch one shift exit. Who is waved through?", "ref": "Align the search standard with s4.1 once material is on surface.", "mw": "01", "msc": false}, {"id": "MG-UGA-03", "std": "Old workings, vent raises, escapeways and abandoned adits registered, secured, inspected for unauthorised entry.", "look": "Register and last inspection. Tools, lights, bags or fresh spoil at surface openings.", "ref": "No MSC equivalent.", "mw": "02 / 01", "msc": false}, {"id": "MG-UGA-04", "std": "Written security response for an underground intrusion, barricade or hostage, with police/GAF liaison and portal control, separate from the OHS plan.", "look": "Security manager walks the first 30 minutes.", "ref": "No MSC equivalent.", "mw": "02 / 05", "msc": false}, {"id": "MG-UGC-01", "std": "High-grade and visible-gold headings flagged; supervised mucking; direct haul to a camera-covered ROM finger; no underground stockpile.", "look": "Ask geology for current headings, then look at one. On surface this becomes a Code s6.4 stockpile.", "ref": "s6.4 once on the ROM.", "mw": "01", "msc": false}, {"id": "MG-UGC-02", "std": "Truck and loader count from each stope to ROM reconciled every shift to fleet data held independently of the mining contractor.", "look": "One shift: truck count, ROM tally, fleet system.", "ref": "Supports s1.3 auditable prime product.", "mw": "01 / 08", "msc": false}, {"id": "MG-UGC-03", "std": "Underground contractors vetted to the employee insider standard; contractor supervisors do not own the reconciliation data.", "look": "Contractor list against access and vetting.", "ref": "s2.7.", "mw": "01", "msc": false}, {"id": "MG-UGX-01", "std": "Underground explosive bays and day boxes locked, alarmed or on camera; issue and return per blaster per shift; unused returned and reconciled the same shift.", "look": "One week of UG issue/return against the surface magazine.", "ref": "No MSC equivalent.", "mw": "10", "msc": false}, {"id": "MG-UGX-02", "std": "Explosives moved portal-to-face in dedicated vehicles, logged, accompanied; detonators separated; nothing left at the face between shifts.", "look": "Face handover.", "ref": "No MSC equivalent.", "mw": "10", "msc": false}, {"id": "MG-UGS-01", "std": "Underground communications reach the security control room, with duress from working levels.", "look": "Test call from a working level.", "ref": "No MSC equivalent.", "mw": "01", "msc": false}, {"id": "MG-UGS-02", "std": "Cameras at portals, exit search, UG explosive bays and loading points, recorded in the control room to the site retention standard.", "look": "Replay yesterday’s portal shift change.", "ref": "Retention aligned to s5.2 (three months) where the feed hits the security NVR.", "mw": "01 / 10", "msc": false}]}], "tp": [{"node": "N1", "area": "Mine / ROM", "point": "High-grade campaign finger to secured stockpile", "material": "Ore", "fromto": "Geology / mining → plant", "measured": "Mass / survey", "recorded": "Grade-control sheet", "twop": "CCTV at night", "code": "s6.4"}, {"node": "N1", "area": "Mine / ROM", "point": "Underground truck count to ROM tally", "material": "Ore", "fromto": "UG contractor → ROM", "measured": "Truck count vs fleet", "recorded": "Shift reconciliation", "twop": "Portal camera", "code": "s6.4 / MG-UGC-02"}, {"node": "N2", "area": "ROM to mill", "point": "Belt scale / weightometer into the mill", "material": "Mill feed", "fromto": "ROM → mill", "measured": "Calibrated scale", "recorded": "Historian", "twop": "Scale house camera", "code": "s7.5"}, {"node": "N2", "area": "ROM to mill", "point": "Scats and conveyor spillage back to circuit", "material": "GBM", "fromto": "Floor → mill", "measured": "Mass if removed", "recorded": "Spillage log", "twop": "Conveyor CCTV", "code": "s6.3"}, {"node": "N3", "area": "Gravity", "point": "Concentrator discharge to intensive leach or redress", "material": "Concentrate", "fromto": "Knelson → ILR / Gemini", "measured": "Weight", "recorded": "Gravity log", "twop": "Discharge pipe in frame", "code": "s6.7"}, {"node": "N3", "area": "Gravity", "point": "Gemini table concentrate to smelt house", "material": "High-grade conc.", "fromto": "Redress → smelt", "measured": "Weight, two-person", "recorded": "Smelt-house register", "twop": "Cage and sump", "code": "s6.8"}, {"node": "N4", "area": "Leach / CIL", "point": "Loaded carbon off the screen", "material": "Loaded carbon", "fromto": "Tank → elution", "measured": "Bags / mass", "recorded": "Carbon register", "twop": "Screen camera", "code": "s6.9"}, {"node": "N4", "area": "Leach / CIL", "point": "Carbon fines", "material": "Fines", "fromto": "Screen → smelt or bags", "measured": "Mass, seal no.", "recorded": "Carbon register", "twop": "Supervisor + CCTV", "code": "s6.9"}, {"node": "N5", "area": "Elution / EW", "point": "Cathode sludge off the cell", "material": "Sludge", "fromto": "Cell → calciner", "measured": "Weight, two-person", "recorded": "Smelt register", "twop": "Cell camera", "code": "s6.10"}, {"node": "N5", "area": "Elution / EW", "point": "Eluant-tank sludge and cell-catchment drain", "material": "Sludge", "fromto": "Tank → smelt", "measured": "Weight", "recorded": "Smelt register", "twop": "Locked valve", "code": "s6.10"}, {"node": "N6", "area": "Smelt / gold room", "point": "Calcine to furnace, bar out", "material": "Doré", "fromto": "Furnace → strong room", "measured": "Bar weight, assay", "recorded": "Gold register", "twop": "Drilling in frame", "code": "ss7.1, 7.7, 7.8"}, {"node": "N6", "area": "Smelt / gold room", "point": "Slag, dust, crucible, liners", "material": "By-product", "fromto": "Smelt → locked store", "measured": "Mass, seal no.", "recorded": "By-product record", "twop": "Double lock", "code": "ss7.9, 9.12"}, {"node": "N7", "area": "Vault / dispatch", "point": "Bar into vault", "material": "Doré", "fromto": "Gold room → vault", "measured": "Count and weight", "recorded": "Strong-room register", "twop": "Dual combination", "code": "s7.6"}, {"node": "N7", "area": "Vault / dispatch", "point": "Sealed dispatch", "material": "Doré", "fromto": "Vault → carrier", "measured": "Seal, weight, bar no.", "recorded": "Dispatch note", "twop": "Loading camera", "code": "s10.1"}, {"node": "N8", "area": "Refinery outturn", "point": "Offtake receipt and fine-gold adjustment", "material": "Fine gold", "fromto": "Carrier → refinery", "measured": "Outturn certificate", "recorded": "Gold register", "twop": "n/a off site", "code": "s7.8"}, {"node": "N8", "area": "Refinery outturn", "point": "Bullion sample to laboratory and return", "material": "Drillings", "fromto": "Smelt → lab → smelt", "measured": "Mass, receipt", "recorded": "Smelt and gold registers", "twop": "Escort", "code": "s7.11"}, {"node": "N9", "area": "Residue", "point": "Tailings and CIL residue", "material": "Residue", "fromto": "Plant → TSF", "measured": "Flow / sampler", "recorded": "Metal account", "twop": "Line CCTV if tamper risk", "code": "s5.1"}, {"node": "N9", "area": "Residue", "point": "Found parcel or recovered GBM", "material": "Exhibit", "fromto": "Find point → safe", "measured": "Mass, assay", "recorded": "Exhibit register", "twop": "Security + metallurgist", "code": "s11.2"}], "tpnote": "Rev B left this blank. It is now pre-structured to the Code nodes. One row per handover. Confirm, split or strike a row on site. The balance network remains Pillar 10 (IMSS-GIP-MAI-2026-01). Two-person and CCTV columns: write Y, N, or partial.", "boq": [{"code": "CCTV_FIXED", "desc": "Fixed camera", "unit": "each"}, {"code": "CCTV_PTZ", "desc": "PTZ camera", "unit": "each"}, {"code": "CCTV_THERMAL", "desc": "Thermal camera", "unit": "each"}, {"code": "CCTV_LPR", "desc": "Licence-plate recognition camera", "unit": "each"}, {"code": "NVR_STORAGE", "desc": "Recorder / storage (90-day, Code minimum 3 months)", "unit": "each"}, {"code": "ACS_DOOR", "desc": "Access-controlled door / turnstile", "unit": "each"}, {"code": "ACS_MANTRAP", "desc": "Mantrap / interlock (plant gate and smelt house)", "unit": "each"}, {"code": "ACS_BIOMETRIC", "desc": "Biometric reader", "unit": "each"}, {"code": "ACS_VEHICLE", "desc": "Vehicle boom / barrier / spike bar", "unit": "each"}, {"code": "SEARCH_XRAY", "desc": "X-ray baggage / parcel scanner", "unit": "each"}, {"code": "SEARCH_WTMD", "desc": "Walk-through metal detector", "unit": "each"}, {"code": "SEARCH_HHMD", "desc": "Hand-held metal detector", "unit": "each"}, {"code": "SEARCH_BAY", "desc": "Vehicle search bay / pit / belly scope / mirrors", "unit": "each"}, {"code": "PIDS_FENCE", "desc": "Fence intrusion detection", "unit": "metre"}, {"code": "PIDS_BEAM", "desc": "Beam / radar detector", "unit": "each"}, {"code": "IDS_ALARM", "desc": "Intrusion / duress alarm point", "unit": "each"}, {"code": "LIGHTING", "desc": "Security lighting", "unit": "mast/fitting"}, {"code": "FENCE", "desc": "Security fence / clear zone (note single or double)", "unit": "metre"}, {"code": "CONTROL_ROOM", "desc": "Control room fit-out, outside the plant", "unit": "lot"}, {"code": "NETWORK_FIBRE", "desc": "Fibre / network run (buried preferred)", "unit": "metre"}, {"code": "NETWORK_RADIO", "desc": "Wireless link / radio repeater", "unit": "each"}, {"code": "POWER_UPS", "desc": "UPS / backup power for CCTV and emergency light", "unit": "each"}, {"code": "TRACKING_VEHICLE", "desc": "Vehicle tracking unit", "unit": "each"}, {"code": "GUARD_TOUR", "desc": "Guard tour verification point", "unit": "each"}, {"code": "VAULT_UPGRADE", "desc": "Vault / strong room (time lock, sensors, fog, rated safe)", "unit": "lot"}, {"code": "MAGAZINE_SEC", "desc": "Magazine security upgrade", "unit": "lot"}, {"code": "UG_TRACKING", "desc": "Underground personnel / vehicle tracking (per portal)", "unit": "lot"}, {"code": "LOCK_GRADE", "desc": "Grade 4 (or equivalent) gate and furnace locks; lock protectors", "unit": "each"}, {"code": "SUMP_LOCK", "desc": "Double-locked sump, French drain or sewer trap", "unit": "each"}], "boqnote": "Quantities only, no prices. Photograph every line. Descriptions in italics were incomplete against the Code and are completed here (belly scope, spike bar, buried fibre, rated safe, sump locks).", "pdata": ["Laboratory information management system (assays)", "Process historian (flows, densities, weights)", "Metal accounting / balance system (AMIRA P754 method)", "Weighbridge and belt-scale records, with adjustment log", "Gold-room and smelt registers (ink, numbered)", "Strong-room / vault and dispatch register", "Refinery outturn certificates and fine-gold adjustments", "Carbon register (all types) and by-product seal register", "Explosives issue / return register", "Access-control and roster data (personal data — Act 843)", "CCTV archive (90-day / 3-month test)", "Security incident register, including parcels found", "Grade-control / mine planning data and high-grade campaign notice", "Underground personnel tracking / tag-board records", "Fleet-management / truck-count data (UG and pit to ROM)", "Key and combination register; sealed combination envelopes"], "pdnote": "Input to Pillar 10 onboarding and the Plant Data Access Agreement. Availability: D digital · P paper · X partial · 0 none · N/A. Quality: G good · U usable · P poor. Carbon, by-product seal, key-envelope and parcel rows were missing from Rev B.", "excnote": "Use one block per Code line the plant cannot meet. Approval is the Manager Metallurgy, with a technical person who understands the process. An open exception with no mitigation is not a close-out.", "rating": "A = Adequate: met in practice. P = Partial: control exists but a Code element is missing. I = Inadequate: paper only, or bypassed. X = Absent. N = Not applicable, reason in observation."};
const RATINGS = ["A","P","I","X","N"];
const RNAME = {A:"Adequate",P:"Partial",I:"Inadequate",X:"Absent",N:"Not applicable"};

/* ---------- storage (IndexedDB) ---------- */
let idb=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("bibiani_walk_revc",1);
 r.onupgradeneeded=e=>{const db=e.target.result;db.createObjectStore("kv");db.createObjectStore("photos",{keyPath:"id"});};
 r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=idb.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);});}
function kvGet(k){return new Promise((res,rej)=>{const r=idb.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function kvSet(k,v){return tx("kv","readwrite",s=>s.put(v,k));}
function photoPut(p){return tx("photos","readwrite",s=>s.put(p));}
function photoDel(id){return tx("photos","readwrite",s=>s.delete(id));}
function photoAll(){return new Promise((res,rej)=>{const r=idb.transaction("photos").objectStore("photos").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}

/* ---------- state ---------- */
let S = { meta:{assessor:"",device:"",stamp:true,started:new Date().toISOString()},
  findings:{}, other:{}, tp:{}, boq:{}, pdata:{}, exc:[], track:[], tracking:false };
let PHOTOS = []; // {id, ref, blob, ts, lat, lon, acc, caption}
let urlCache = {};
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await kvSet("state",S);setDb("on","Saved");}catch(e){setDb("off","Save failed");}},300);}
function setDb(c,t){document.getElementById("dbDot").className="dot "+c;document.getElementById("dbTxt").textContent=t;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);}
function confirmBox(msg){return new Promise(res=>{const c=document.getElementById("confirm");document.getElementById("confirmMsg").textContent=msg;c.classList.add("show");
 const y=document.getElementById("confirmYes"),n=document.getElementById("confirmNo");const done=v=>{c.classList.remove("show");y.onclick=n.onclick=null;res(v);};y.onclick=()=>done(true);n.onclick=()=>done(false);});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtT(iso){if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});}
function fmtG(g){return g&&g.lat!=null?g.lat.toFixed(5)+", "+g.lon.toFixed(5)+" ±"+Math.round(g.acc||0)+"m":"";}

/* ---------- GPS ---------- */
let lastFix=null, watchId=null, trackTimer=null;
function setGps(c,t){document.getElementById("gpsDot").className="dot "+c;document.getElementById("gpsTxt").textContent=t;}
function startWatch(){ if(!navigator.geolocation){setGps("off","No GPS");return;}
 if(watchId!=null) return;
 setGps("warn","GPS…");
 watchId=navigator.geolocation.watchPosition(p=>{lastFix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,alt:p.coords.altitude,ts:new Date(p.timestamp).toISOString()};
   setGps(p.coords.accuracy<=25?"on":"warn","±"+Math.round(p.coords.accuracy)+"m");
   const el=document.getElementById("liveFix");if(el)el.textContent=fmtG(lastFix)+(lastFix.alt!=null?" · alt "+Math.round(lastFix.alt)+"m":"");
   if(S.tracking) maybeLogTrack();
 },e=>{setGps("off",e.code===1?"GPS denied":"GPS off");},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});}
function getFix(){return new Promise(res=>{ if(lastFix && (Date.now()-new Date(lastFix.ts))<15000) return res(lastFix);
 if(!navigator.geolocation) return res(lastFix);
 navigator.geolocation.getCurrentPosition(p=>{lastFix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,alt:p.coords.altitude,ts:new Date(p.timestamp).toISOString()};res(lastFix);},()=>res(lastFix),{enableHighAccuracy:true,timeout:12000,maximumAge:30000});});}
function dist(a,b){const R=6371000,toR=x=>x*Math.PI/180;const dLat=toR(b.lat-a.lat),dLon=toR(b.lon-a.lon);const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function maybeLogTrack(){ if(!lastFix) return; const last=S.track[S.track.length-1];
 if(last && last.kind==="track" && dist(last,lastFix)<8 && (Date.now()-new Date(last.ts))<60000) return;
 S.track.push({kind:"track",lat:lastFix.lat,lon:lastFix.lon,acc:lastFix.acc,alt:lastFix.alt,ts:new Date().toISOString(),zone:curZone()}); save(); }
function logEvent(label,ref){ if(!lastFix) return; S.track.push({kind:"event",label,ref,lat:lastFix.lat,lon:lastFix.lon,acc:lastFix.acc,alt:lastFix.alt,ts:new Date().toISOString(),zone:curZone()}); save(); }
function curZone(){return view.startsWith("Z")?view:view;}

/* ---------- photos ---------- */
async function addPhotos(files,ref){ const fix=await getFix(); let n=0;
 for(const f of files){ try{ const blob=await compress(f,ref,fix); const p={id:"p"+Date.now()+"_"+Math.random().toString(36).slice(2,7),ref,blob,ts:new Date().toISOString(),lat:fix?fix.lat:null,lon:fix?fix.lon:null,acc:fix?fix.acc:null,caption:""};
   await photoPut(p);PHOTOS.push(p);n++; }catch(e){console.error(e);} }
 logEvent("photo",ref); toast(n+" photo"+(n>1?"s":"")+" saved"+(fix?" · geotagged":"")); render(); }
function compress(file,ref,fix){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
 img.onload=()=>{URL.revokeObjectURL(u);const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(img,0,0,w,h);
  if(S.meta.stamp){const fs=Math.max(14,Math.round(w/45));x.font="bold "+fs+"px Arial";const lines=[ref+" · "+new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}),(fix?fmtG(fix):"no GPS fix")+" · IMSS Bibiani Rev C"];
   const pad=fs*0.5,lh=fs*1.3,bh=lh*lines.length+pad*2;x.fillStyle="rgba(11,24,41,.72)";x.fillRect(0,h-bh,w,bh);x.fillStyle="#C8A84B";lines.forEach((l,i)=>x.fillText(l,pad,h-bh+pad+lh*(i+0.8)));}
  c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.82);};

function stamp(){return new Date().toISOString().replace(/[:T]/g,"").slice(0,13);}
async function dl(name,blob){const f=new File([blob],name,{type:blob.type});
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});toast("Shared "+name);return;}catch(e){if(e&&e.name==="AbortError")return;}}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);toast("Saved "+name);}
function b64(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(blob);});}
async function backupBlob(){const ph=[];for(const p of PHOTOS)ph.push({id:p.id,ref:p.ref,ts:p.ts,lat:p.lat,lon:p.lon,acc:p.acc,caption:p.caption,jpeg:await b64(p.blob)});
 return new Blob([JSON.stringify({app:"IMSS Bibiani Field Walk Rev C",exported:new Date().toISOString(),state:S,photos:ph})],{type:"application/json"});}
async function expBackup(){toast("Packing photos…");dl("Bibiani_RevC_backup_"+stamp()+".json",await backupBlob());}
async function shareBackup(){try{const f=new File([await backupBlob()],"Bibiani_RevC_backup_"+stamp()+".json",{type:"application/json"});if(navigator.canShare&&!navigator.canShare({files:[f]}))throw 0;await navigator.share({files:[f],title:"Bibiani Rev C backup"});}catch(e){toast("Share not available here; use Full backup");}}
function csvq(s){s=String(s==null?"":s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function expCSV(){const rows=[["Zone","ID","Standard","Code ref","MW","Rating","Rating name","Observation","Exception","Lat","Lon","Acc_m","Rated at","Photos"]];
 DATA.zones.forEach(z=>z.stds.forEach(s=>{const f=S.findings[s.id]||{};rows.push([z.id,s.id,s.std,s.ref,s.mw,f.r||"",f.r?RNAME[f.r]:"",f.obs||"",f.exc?"Y":"",f.gps?f.gps.lat:"",f.gps?f.gps.lon:"",f.gps?Math.round(f.gps.acc):"",f.ts||"",PHOTOS.filter(p=>p.ref===s.id).length]);}));
 rows.push([]);rows.push(["Transfer points"]);rows.push(["Node","TP","Point","Status","Two-person","CCTV","Rating","Observation","Lat","Lon"]);
 DATA.tp.forEach((t,i)=>{const k="TP"+(i+1),r=S.tp[k]||{};rows.push([t.node,k,t.point,r.status||"",r.twop||"",r.cctv||"",r.r||"",r.obs||"",r.gps?r.gps.lat:"",r.gps?r.gps.lon:""]);});
 rows.push([]);rows.push(["BOQ"]);rows.push(["Code","Description","Unit","Qty","On site","Zone","Location","Notes","Lat","Lon"]);
 DATA.boq.forEach(b=>{const r=S.boq[b.code]||{};rows.push([b.code,b.desc,b.unit,r.qty||"",r.onsite||"",r.zone||"",r.loc||"",r.notes||"",r.gps?r.gps.lat:"",r.gps?r.gps.lon:""]);});
 rows.push([]);rows.push(["Plant data"]);rows.push(["Source","System","Avail","Quality","History","Resolution","Owner","Notes"]);
 DATA.pdata.forEach((s,i)=>{const r=S.pdata["PD"+(i+1)]||{};rows.push([s,r.sys||"",r.av||"",r.q||"",r.hist||"",r.res||"",r.owner||"",r.notes||""]);});
 rows.push([]);rows.push(["Exceptions"]);rows.push(["No","Clause","Why","Mitigation","Impact","Action","Decision"]);
 S.exc.forEach((e,i)=>rows.push([i+1,e.clause,e.why,e.mit,e.impact,e.action,e.decision]));
 rows.push([]);rows.push(["Photos"]);rows.push(["ID","Ref","Time","Lat","Lon","Acc_m","Caption"]);PHOTOS.forEach(p=>rows.push([p.id,p.ref,p.ts,p.lat,p.lon,p.acc?Math.round(p.acc):"",p.caption]));
 dl("Bibiani_RevC_findings_"+stamp()+".csv",new Blob(["﻿"+rows.map(r=>r.map(csvq).join(",")).join("\r\n")],{type:"text/csv"}));}
function expGPX(){const x=s=>esc(s);let g=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="IMSS Bibiani Field Walk Rev C" xmlns="http://www.topografix.com/GPX/1/1">\n`;
 const wp=[];S.track.filter(t=>t.kind==="event").forEach(t=>wp.push({lat:t.lat,lon:t.lon,ts:t.ts,name:(t.ref?t.ref+" ":"")+t.label}));
 Object.entries(S.findings).forEach(([k,f])=>{if(f.gps)wp.push({lat:f.gps.lat,lon:f.gps.lon,ts:f.ts,name:k+(f.r?" ["+f.r+"]":""),desc:f.obs});});
 PHOTOS.forEach(p=>{if(p.lat!=null)wp.push({lat:p.lat,lon:p.lon,ts:p.ts,name:"photo "+p.ref,desc:p.caption});});
 wp.forEach(w=>g+=`<wpt lat="${w.lat}" lon="${w.lon}"><time>${w.ts||""}</time><name>${x(w.name)}</name>${w.desc?`<desc>${x(w.desc)}</desc>`:""}</wpt>\n`);
 g+=`<trk><name>Bibiani walk</name><trkseg>\n`+S.track.filter(t=>t.kind==="track").map(t=>`<trkpt lat="${t.lat}" lon="${t.lon}">${t.alt!=null?`<ele>${t.alt.toFixed(1)}</ele>`:""}<time>${t.ts}</time></trkpt>`).join("\n")+`\n</trkseg></trk>\n</gpx>`;
 dl("Bibiani_RevC_track_"+stamp()+".gpx",new Blob([g],{type:"application/gpx+xml"}));}
async function expReport(){toast("Building report…");const c=counts();const img=async p=>`<figure><img src="data:image/jpeg;base64,${await b64(p.blob)}"><figcaption>${esc(p.ref)} · ${fmtT(p.ts)} · ${fmtG(p)}${p.caption?" · "+esc(p.caption):""}</figcaption></figure>`;
 let h=`<!doctype html><html><head><meta charset="utf-8"><title>IMSS Bibiani Field Walk Rev C — Evidence</title><style>body{font:11pt Arial;color:#17202B;margin:0;padding:20mm 15mm;max-width:210mm}h1{color:#0B1829;border-bottom:3px solid #C8A84B;padding-bottom:6px}h2{color:#0B1829;margin-top:28px;border-left:5px solid #C8A84B;padding-left:8px}.s{border:1px solid #D8D4CB;border-radius:6px;padding:8px 10px;margin:10px 0;page-break-inside:avoid}.msc{background:#FFF4D6}.id{font-weight:700;background:#0B1829;color:#fff;padding:1px 6px;border-radius:3px;font-size:10pt}.r{font-weight:700;padding:1px 8px;border-radius:3px;color:#fff;margin-left:6px}.A{background:#1F7A3A}.P{background:#C77D00}.I{background:#C8381D}.X{background:#6B1E12}.N{background:#5C6672}figure{display:inline-block;margin:6px 6px 6px 0;width:48%;vertical-align:top}figure img{width:100%;border:1px solid #D8D4CB}figcaption{font-size:8pt;color:#5C6672}.m{color:#5C6672;font-size:9pt}table{border-collapse:collapse;width:100%;font-size:9pt}td,th{border:1px solid #D8D4CB;padding:4px;text-align:left;vertical-align:top}footer{margin-top:30px;font-size:8pt;color:#5C6672;border-top:1px solid #D8D4CB;padding-top:6px}</style></head><body>
 <h1>IMSS Bibiani Field Walk — Rev C evidence pack</h1><p class="m">IMSS-GIP-FLD-2026-02 Rev C · against MSC Risk and Security Gold Code Rev 02 · Assessor ${esc(S.meta.assessor||"—")} · exported ${fmtT(new Date().toISOString())} · ${c.rated}/${c.all} rated · ${c.gaps} gaps · ${PHOTOS.length} photos</p>`;
 for(const z of DATA.zones){h+=`<h2>${z.id} — ${esc(z.title)}</h2>`;for(const s of z.stds){const f=S.findings[s.id]||{};const ps=PHOTOS.filter(p=>p.ref===s.id);if(!f.r&&!f.obs&&!ps.length)continue;
  h+=`<div class="s ${s.msc?"msc":""}"><span class="id">${s.id}</span>${f.r?`<span class="r ${f.r}">${f.r} · ${RNAME[f.r]}</span>`:""}${f.exc?` <b style="color:#C8381D">EXCEPTION</b>`:""}<div><b>${esc(s.std)}</b></div><div class="m">Code: ${esc(s.ref)} · MW ${esc(s.mw)} · ${f.ts?fmtT(f.ts):""} ${f.gps?"· "+fmtG(f.gps):""}</div>${f.obs?`<p>${esc(f.obs).replace(/\n/g,"<br>")}</p>`:""}`;for(const p of ps)h+=await img(p);h+=`</div>`;}
  if(S.other[z.id]||PHOTOS.some(p=>p.ref===z.id+"-OTHER")){h+=`<div class="s"><b>Other observations</b><p>${esc(S.other[z.id]||"").replace(/\n/g,"<br>")}</p>`;for(const p of PHOTOS.filter(p=>p.ref===z.id+"-OTHER"))h+=await img(p);h+=`</div>`;}}
 h+=`<h2>Transfer-point register</h2><table><tr><th>Node</th><th>Point</th><th>Status</th><th>2-person</th><th>CCTV</th><th>Rating</th><th>Observation</th></tr>`;DATA.tp.forEach((t,i)=>{const r=S.tp["TP"+(i+1)]||{};h+=`<tr><td>${t.node}</td><td>${esc(t.point)}</td><td>${esc(r.status||"")}</td><td>${esc(r.twop||"")}</td><td>${esc(r.cctv||"")}</td><td>${r.r||""}</td><td>${esc(r.obs||"")}</td></tr>`;});h+=`</table>`;
 for(let i=0;i<DATA.tp.length;i++){const ps=PHOTOS.filter(p=>p.ref==="TP"+(i+1));if(ps.length){h+=`<div class="s"><b>TP${i+1} · ${esc(DATA.tp[i].point)}</b><br>`;for(const p of ps)h+=await img(p);h+=`</div>`;}}
 h+=`<h2>Hardware survey — BOQ</h2><table><tr><th>Code</th><th>Description</th><th>Unit</th><th>Qty</th><th>On site</th><th>Zone</th><th>Location</th><th>Notes</th></tr>`;DATA.boq.forEach(b=>{const r=S.boq[b.code]||{};if(!r.qty&&!r.onsite&&!r.notes&&!r.loc)return;h+=`<tr><td>${b.code}</td><td>${esc(b.desc)}</td><td>${esc(b.unit)}</td><td>${esc(r.qty||"")}</td><td>${esc(r.onsite||"")}</td><td>${esc(r.zone||"")}</td><td>${esc(r.loc||"")}</td><td>${esc(r.notes||"")}</td></tr>`;});h+=`</table>`;
 for(const b of DATA.boq){const ps=PHOTOS.filter(p=>p.ref===b.code);if(ps.length){h+=`<div class="s"><b>${b.code} · ${esc(b.desc)}</b><br>`;for(const p of ps)h+=await img(p);h+=`</div>`;}}
 h+=`<h2>Plant data availability</h2><table><tr><th>Source</th><th>System</th><th>Avail</th><th>Qual</th><th>History</th><th>Resolution</th><th>Owner</th><th>Notes</th></tr>`;DATA.pdata.forEach((s,i)=>{const r=S.pdata["PD"+(i+1)]||{};h+=`<tr><td>${esc(s)}</td><td>${esc(r.sys||"")}</td><td>${esc(r.av||"")}</td><td>${esc(r.q||"")}</td><td>${esc(r.hist||"")}</td><td>${esc(r.res||"")}</td><td>${esc(r.owner||"")}</td><td>${esc(r.notes||"")}</td></tr>`;});h+=`</table>`;
 if(S.exc.length){h+=`<h2>Z7 — Exception Reports (Code ss1.4 and 15)</h2>`;for(let i=0;i<S.exc.length;i++){const e=S.exc[i];h+=`<div class="s"><span class="id">EXC-${String(i+1).padStart(2,"0")}</span> <b>${esc(e.clause)}</b><table><tr><th>Why it cannot be met</th><td>${esc(e.why)}</td></tr><tr><th>Mitigation now</th><td>${esc(e.mit)}</td></tr><tr><th>Impact on Code integrity</th><td>${esc(e.impact)}</td></tr><tr><th>Action and date</th><td>${esc(e.action)}</td></tr><tr><th>Manager Metallurgy</th><td>${esc(e.decision)}</td></tr></table>`;for(const p of PHOTOS.filter(p=>p.ref==="EXC-"+(i+1)))h+=await img(p);h+=`</div>`;}}
 const tr=S.track.filter(t=>t.kind==="track");h+=`<h2>GPS</h2><p class="m">${tr.length} track points, ${S.track.length-tr.length} events. Full track in the .gpx export.</p>`;
 h+=`<footer>Flashman &amp; Associates (Pty) Ltd · 7 Barry Hertzog Drive, Florida Park, Johannesburg · Reg. 2013/190188/07 · PSIRA 5119079 · info@flashman-aa.com · Commercial-in-Confidence. The MSC Code is confidential to the operation it is issued to; this pack cites clause numbers and control intent only.</footer></body></html>`;
 dl("Bibiani_RevC_evidence_"+stamp()+".html",new Blob([h],{type:"text/html"}));}
async function impBackup(file){if(!file)return;try{const j=JSON.parse(await file.text());if(!j.state)throw 0;const st=j.state;
 const newer=(a,b)=>!a||!a.ts||(b&&b.ts&&b.ts>a.ts);
 Object.entries(st.findings||{}).forEach(([k,v])=>{if(newer(S.findings[k],v))S.findings[k]=v;});
 Object.entries(st.tp||{}).forEach(([k,v])=>{if(newer(S.tp[k],v))S.tp[k]=v;});
 Object.assign(S.boq,st.boq||{});Object.assign(S.pdata,st.pdata||{});Object.entries(st.other||{}).forEach(([k,v])=>{if(v)S.other[k]=v;});
 (st.exc||[]).forEach(e=>{if(!S.exc.some(x=>x.clause===e.clause&&x.why===e.why))S.exc.push(e);});
 const have=new Set(S.track.map(t=>t.ts+t.kind));(st.track||[]).forEach(t=>{if(!have.has(t.ts+t.kind))S.track.push(t);});S.track.sort((a,b)=>a.ts<b.ts?-1:1);
 let n=0;for(const p of (j.photos||[])){if(PHOTOS.some(x=>x.id===p.id))continue;const bin=atob(p.jpeg);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const rec={id:p.id,ref:p.ref,ts:p.ts,lat:p.lat,lon:p.lon,acc:p.acc,caption:p.caption||"",blob:new Blob([u8],{type:"image/jpeg"})};await photoPut(rec);PHOTOS.push(rec);n++;}
 save();render();toast("Imported · "+n+" new photos");}catch(e){toast("Not a valid backup file");}}
async function wipe(){if(!await confirmBox("Clear ALL findings, photos and GPS logs on this phone?"))return;if(!await confirmBox("Really clear? Export a backup first."))return;
 await tx("photos","readwrite",s=>s.clear());await tx("kv","readwrite",s=>s.clear());PHOTOS=[];S={meta:{assessor:S.meta.assessor,device:S.meta.device,stamp:true,started:new Date().toISOString()},findings:{},other:{},tp:{},boq:{},pdata:{},exc:[],track:[],tracking:false};save();render();toast("Cleared");}

   if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(ok=>{if(!ok)setDb("warn","Back up daily");});}
 }catch(e){ setDb("off","No storage"); toast("Storage unavailable: open this file in Chrome, not a preview"); }
 render(); startWatch();

 const standalone=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);let hide=false;try{hide=localStorage.getItem("inst_hide")==="1";}catch(e){}
 if(ios&&!standalone&&!hide&&location.protocol.startsWith("http"))document.getElementById("install").classList.add("show");

 document.addEventListener("click",keepAwake,{once:true});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake();});

})();
